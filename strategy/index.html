<!DOCTYPE html>
<!--
  STRATEGIC OBSERVATIONS
  v1.3 — 13/08/2026

  Changelog:
  v1.3 — The pad in cool ink. Uncommitted material was reading as part of the
         record: same warm stock, same rules, same everything but italics.
         Now the pad carries a cool grey wash and cool text against the warm
         paper — pencil laid on it rather than ink on it. Cool reads as
         provisional where warm reads as settled, and it does that without
         importing the urgency an amber or a red would; nothing on the pad is
         a warning, it simply is not banked yet.
         COLOUR ONLY, and scoped to #tier2. Every rule sets a colour and
         nothing else, and the wash takes its breathing room from padding the
         rows already had — so a full band appears with no box changing shape.
         Verified by diffing computed geometry and type across 73 elements
         before and after: none moved.
  v1.2 — Analysis, quotations, substrate. Three additions, all so that a thing
         lands in exactly one place:
         - An ANALYSIS section between the settled observations and the pad.
           A working explanation of why a pattern persists is neither an
           observation nor evidence; filed as an observation it reads as a
           finding, filed as evidence it acquires a date it does not have. It
           is numbered, and it carries no evidence table — the absence of that
           table is what tells you which kind of thing you are reading.
         - Evidence marked quote:true is set as a quotation. Some evidence is
           strongest as the exact words written down at the time, and it has to
           look different from a description of them.
         - foundational:true puts a label beside an observation the others are
           downstream of, and observation text now breaks on blank lines,
           because substrate has to explain what it sits underneath.
  v1.1 — Dossier. v1.0 borrowed the desk's palette and fonts, which made this
         read as another page of the same product; it is not, and it should not
         look like one. Now: warm stock rather than the desk's cool grey, one
         serif (Source Serif 4) doing every job including the labels, a narrower
         measure, hairline rules instead of filled blocks, and no colour at all
         except the [confirm] flag in oxblood. Nothing app-like — it should read
         as a document somebody compiled, because that is what it is.
         Deliberately light-only: paper does not have a dark mode.
  v1.0 — First build.

  A deliberately simpler page than the desk. Headings, tables and prose. No
  widgets, no dashboards, no charts, no drag-and-drop, and — unlike the desk —
  no writes at all. Everything here is authored by Claude through the MCP
  server (get_strategy / patch_strategy / update_strategy against
  /strategyReference); this page only reads.

  That read-only-ness is the point rather than a shortcut. The value of the
  record is that observations stay general and evidence stays dated, and both
  of those survive by being written deliberately in conversation, not typed
  into a box in a hurry. Capture happens on the scratch pad, in a Strategy
  chat. This page is where you come to see what has accumulated.

  Access: the underlying node is readable only by Richard's Google account
  (see database.rules.json). This HTML is public — GitHub Pages serves the
  whole repo — but the content behind it is not, and no observation text is
  ever committed to the repo.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<!-- Every subresource request (fonts, the Firebase SDK) would otherwise carry
     this page's URL to Google in a Referer header. It does not need to. -->
<meta name="referrer" content="no-referrer">
<!-- Deliberately says nothing. The tab title is the one piece of this page a
     passer-by reads over your shoulder, and it used to name the document. -->
<title>Private</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  /* One serif does every job here — headings, body, dates, labels. The desk
     runs three families and a mono; using any of them would tie this back to it.
     No monospace anywhere: a mono date reads as a system timestamp, and these
     dates are mostly "Ongoing" and "c. 2024–25", written by a person.

     Light only, and that is a commitment rather than an omission. This is meant
     to read as paper, and paper has no dark mode. Colours are painted
     explicitly so it cannot borrow a host theme. */
  :root{
    --stock:#F5F1E8;      /* warm paper, not the desk's cool grey */
    --ink:#221F1A;        /* warm near-black */
    --faint:#6B6459;
    --hairline:#DDD6C7;
    --rule:#B9B0A0;
    --oxblood:#8A3324;    /* the only accent on the record itself, and only for [confirm] */

    /* The pad is COOL against warm stock — pencil laid on paper, not ink on it.
       Cool reads as provisional where warm reads as settled, and it does that
       without any of the urgency an amber or a red would import. Nothing on the
       pad is a warning; it is simply not part of the record yet. */
    --pad-wash:#EAEBEC;
    --pad-ink:#5E636B;
    --pad-rule:#D2D5D9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--stock);color:var(--ink);
    font-family:'Source Serif 4','Iowan Old Style',Georgia,serif;
    font-size:1.02rem;line-height:1.62;min-height:100vh;padding:0 22px 110px;
    -webkit-font-smoothing:antialiased}
  /* Narrow measure. The whole page is one column of continuous reading, and a
     720px line of serif is too long to hold. */
  .wrap{max-width:620px;margin:0 auto}
  .hidden{display:none}

  /* Labels throughout are letterspaced small caps in the same serif — the page's
     only typographic device, carrying every label: tier, column head, solutions,
     retired, the sign-in. */

  header{padding:56px 0 20px;margin-bottom:8px;border-bottom:2px solid var(--ink)}
  h1{font-weight:600;font-size:1.55rem;letter-spacing:0.005em;line-height:1.2}
  .stamp{font-size:0.78rem;font-style:italic;color:var(--faint);margin-top:8px}
  .standing{font-size:0.92rem;color:var(--faint);margin-top:20px;max-width:56ch}

  h2{font-weight:600;font-size:1.02rem;letter-spacing:0.11em;text-transform:uppercase;
    margin:56px 0 0;padding-bottom:8px;border-bottom:1px solid var(--rule)}
  h2 .tier{display:block;font-size:0.68rem;font-weight:400;letter-spacing:0.16em;
    color:var(--faint);margin-bottom:6px}
  .tier-note{font-size:0.88rem;font-style:italic;color:var(--faint);
    margin:14px 0 4px;max-width:58ch}

  .obs{margin:38px 0 0;padding-bottom:34px;border-bottom:1px solid var(--hairline)}
  .obs:last-child{border-bottom:none}
  .obs h3{font-weight:600;font-size:1.1rem;line-height:1.35}
  /* The letter is the filing reference — it hangs outside the title on a wide
     enough screen, the way a clause number would. */
  .obs h3 .letter{color:var(--faint);font-weight:400}
  .obs .diagnosis{margin-top:10px;max-width:58ch}
  .obs.retired{opacity:0.58}
  .obs.retired h3::after{content:' — retired';font-size:0.7rem;font-weight:600;
    letter-spacing:0.13em;text-transform:uppercase;color:var(--faint)}

  /* Fixed layout, not auto. Left to itself each table sizes its own date column,
     so "Ongoing" and "w/c 10/08/2026" start the evidence at different indents in
     consecutive observations — the columns visibly fail to line up down the page.
     A fixed width makes every table one column. */
  table{width:100%;border-collapse:collapse;margin-top:22px;font-size:0.92rem;
    table-layout:fixed}
  th{text-align:left;font-size:0.68rem;font-weight:600;letter-spacing:0.13em;
    text-transform:uppercase;color:var(--faint);
    padding:0 18px 7px 0;border-bottom:1px solid var(--rule)}
  td{padding:10px 18px 10px 0;border-bottom:1px solid var(--hairline);vertical-align:top;
    overflow-wrap:break-word}
  td:last-child,th:last-child{padding-right:0}
  /* The observation's own rule closes the block — a row border as well reads as
     a doubled line with a gap in it. */
  tbody tr:last-child td{border-bottom:none}
  th:first-child,td.date{width:9em}
  td.date{font-style:italic;font-size:0.86rem;color:var(--faint)}
  .confirm{color:var(--oxblood);font-size:0.68rem;font-weight:600;font-style:normal;
    letter-spacing:0.1em;display:block;margin-top:3px}

  /* Verbatim source material. Indented and italic so it is visibly somebody
     else's words — the exact wording is the evidence, not a description of it. */
  td.quote{font-style:italic;padding-left:16px;border-left:2px solid var(--rule);
    margin-left:0}

  /* Reasoning, not findings. Numbered, no table, no dates — the absence of an
     evidence column is what tells you which kind of thing you are reading. */
  .analysis-item{margin:34px 0 0;padding-bottom:30px;border-bottom:1px solid var(--hairline)}
  .analysis-item:last-child{border-bottom:none}
  .analysis-item h3{font-weight:600;font-size:1.05rem;line-height:1.35;margin-bottom:14px}
  .analysis-item ol{margin:0;padding-left:1.4em}
  .analysis-item li{margin-bottom:11px;max-width:56ch;padding-left:0.3em}
  .analysis-item li::marker{color:var(--faint);font-size:0.85em}
  .consequence{margin-top:18px;padding-left:20px;border-left:1px solid var(--rule);
    font-style:italic;color:var(--faint);max-width:56ch}

  /* Substrate, not a peer — the others are downstream of it. */
  .foundational{display:inline-block;margin-left:10px;font-size:0.62rem;font-weight:600;
    letter-spacing:0.13em;text-transform:uppercase;color:var(--faint);
    border:1px solid var(--rule);padding:2px 7px;vertical-align:middle}

  /* Indented and ruled rather than boxed. A filled card would make the fix look
     like the finding, and the whole point is that they stay apart. */
  .solutions{margin-top:24px;padding:2px 0 2px 20px;border-left:1px solid var(--rule)}
  .solutions h4{font-size:0.68rem;font-weight:600;letter-spacing:0.13em;
    text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .solutions li{list-style:none;font-size:0.94rem;margin-bottom:9px;max-width:56ch}
  .solutions li:last-child{margin-bottom:0}
  .solutions .brief{color:var(--faint);font-style:italic}

  /* The pad is set in italic throughout: it reads as provisional at a glance,
     which is exactly its status. Nothing here is part of the record yet. */
  .scratch li{list-style:none;padding:11px 0;border-bottom:1px solid var(--hairline);
    display:flex;gap:18px;align-items:baseline;font-style:italic}
  .scratch li:last-child{border-bottom:none}
  .scratch .ts{font-size:0.8rem;color:var(--faint);white-space:nowrap}
  .scratch .anchor{font-size:0.78rem;color:var(--faint);font-style:normal;
    letter-spacing:0.04em}
  .empty{font-size:0.92rem;color:var(--faint);font-style:italic;padding:14px 0}

  /* ---- The pad, in cool ink ----
     COLOUR ONLY, and scoped to #tier2 so it cannot reach the record. Every rule
     below sets a colour and nothing else: no padding, no margin, no size, no
     weight, no family. The wash sits on rows that already carry 11px of vertical
     padding, so it gets its breathing room from spacing that was there before —
     which is how a full band appears without a single box changing shape. */
  #tier2 h2{border-bottom-color:var(--pad-rule);color:var(--pad-ink)}
  #tier2 h2 .tier,#tier2 .tier-note{color:var(--pad-ink)}
  #tier2 .scratch li{background:var(--pad-wash);color:var(--pad-ink);
    border-bottom-color:var(--pad-rule)}
  #tier2 .scratch .ts,#tier2 .scratch .anchor{color:var(--pad-ink)}
  #tier2 .empty{color:var(--pad-ink)}

  .questions{margin-top:22px}
  .questions p{margin-bottom:18px;max-width:58ch}
  .questions .answer{color:var(--faint);font-size:0.92rem;font-style:italic}
  .questions .answered{opacity:0.66}

  .panel{max-width:400px;margin:22vh auto;text-align:center}
  .panel p{color:var(--faint);margin-bottom:22px;font-style:italic}
  button{font-family:inherit;font-size:0.8rem;font-weight:600;letter-spacing:0.13em;
    text-transform:uppercase;padding:11px 26px;background:transparent;color:var(--ink);
    border:1px solid var(--ink);cursor:pointer}
  button:hover{background:var(--ink);color:var(--stock)}
  footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--rule);
    font-size:0.78rem;font-style:italic;color:var(--faint)}

  @media (max-width:520px){
    body{font-size:0.98rem;padding:0 18px 80px}
    header{padding-top:36px}

    /* Stop being a table. Narrowing the date column instead just breaks dates
       mid-number ("w/c 10/08/202 / 6"), and there is no width at which a date
       and a full sentence both fit on a phone. The date sits above its evidence
       as a dateline, which is how it would read on paper anyway. The column
       heads go with it — an italic date above a sentence needs no label. */
    thead{display:none}
    table,tbody,tr,td{display:block;width:auto}
    tr{padding:12px 0;border-bottom:1px solid var(--hairline)}
    tbody tr:last-child{border-bottom:none}
    td{border-bottom:none;padding:0}
    td.date{width:auto;margin-bottom:4px}
    .confirm{display:inline;margin:0 0 0 10px}
  }
</style>
</head>
<body>

<!-- Nothing below says what this page is until the read succeeds. The gate is a
     bare control, the loading state is blank, and the header is injected by
     render() rather than sitting in the markup — so a visitor who is not signed
     in, or is signed in as somebody else, gets an empty page rather than the
     shape of a document with the contents withheld.

     Be clear about what this does and does not buy. It removes the DOM, not the
     source: the section labels and the description are still in the script below
     and legible to anyone who opens view-source, because GitHub Pages serves
     this file to the world. Only moving the page off Pages fixes that. -->

<div id="gate" class="panel hidden">
  <button id="signin">Sign in</button>
</div>

<div id="loading" class="panel"></div>

<div id="error" class="panel hidden"><p id="errmsg"></p></div>

<div id="doc" class="wrap hidden">
  <header id="head"></header>
  <div id="tier1"></div>
  <div id="analysis"></div>
  <div id="tier2"></div>
  <div id="tier3"></div>
  <footer id="foot"></footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyA3ga4wTbLELE3jvrl40j7OclsYCt8PtIo",
    authDomain: "morning-walks-42eb6.firebaseapp.com",
    databaseURL: "https://morning-walks-42eb6-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "morning-walks-42eb6"
  });

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const show = id => { ["gate","loading","error","doc"].forEach(x => $(x).classList.add("hidden"));
    $(id).classList.remove("hidden"); };
  // RTDB collapses sparse arrays into objects, so never assume Array here.
  const asArray = v => Array.isArray(v) ? v : Object.values(v || {});

  const fail = msg => { $("errmsg").textContent = msg; show("error"); };

  $("signin").addEventListener("click", () =>
    firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e => fail("Sign-in failed: " + e.message)));

  firebase.auth().onAuthStateChanged(user => {
    if (!user) { show("gate"); return; }
    show("loading");
    firebase.database().ref("strategyReference").on("value",
      snap => render(snap.val()),
      err => fail(err.code === "PERMISSION_DENIED"
        ? "This account doesn't have access to the strategy record."
        : "Couldn't load: " + err.message));
  });

  /* ---------- rendering ----------
     Dates on evidence are free text ("Ongoing", "c. 2024-25", "w/c 10/08/2026")
     because that is the honest precision of most of it. Only the meta stamp and
     scratch timestamps are real ISO dates, so only those get formatted. */

  const fmtStamp = iso => {
    const d = new Date(iso);
    return isNaN(d) ? String(iso || "") : d.toLocaleString("en-GB",
      { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
  };
  const fmtDay = iso => {
    const d = new Date(iso);
    return isNaN(d) ? String(iso || "") : d.toLocaleDateString("en-GB",
      { day:"2-digit", month:"2-digit" });
  };

  // Blank lines become paragraphs. A substrate observation has to explain what
  // it sits underneath, and that does not fit in one paragraph.
  const paras = (text, cls) => String(text ?? "").split(/\n\s*\n/)
    .map(p => p.trim()).filter(Boolean)
    .map(p => '<p class="' + cls + '">' + esc(p).replace(/\n/g, "<br>") + '</p>').join("");

  function evidenceTable(evidence) {
    if (!evidence.length) return '<p class="empty">No evidence logged yet.</p>';
    return '<table><thead><tr><th>Date</th><th>Evidence</th></tr></thead><tbody>' +
      evidence.map(e => '<tr><td class="date">' + esc(e.date || "Ongoing") +
        (e.confirm ? '<span class="confirm">[confirm]</span>' : '') +
        // Verbatim evidence is set as a quotation: the exact wording is the
        // point, so it must be visibly distinct from a description of it.
        '</td><td' + (e.quote ? ' class="quote"' : '') + '>' + esc(e.text) + '</td></tr>').join("") +
      '</tbody></table>';
  }

  function solutionsBlock(solutions) {
    if (!solutions.length) return "";
    return '<div class="solutions"><h4>Proposed solutions</h4><ul>' +
      solutions.map(s => '<li>' + esc(s.text) +
        (s.brief ? ' <span class="brief">— ' + esc(s.brief) + '</span>' : '') + '</li>').join("") +
      '</ul></div>';
  }

  function observationBlock(o) {
    return '<div class="obs' + (o.state === "retired" ? " retired" : "") + '">' +
      '<h3><span class="letter">' + esc(o.letter || "?") + ' — </span>' + esc(o.title) +
      (o.foundational ? '<span class="foundational">Foundational</span>' : '') + '</h3>' +
      paras(o.text, "diagnosis") +
      evidenceTable(asArray(o.evidence)) +
      solutionsBlock(asArray(o.solutions)) +
      '</div>';
  }

  // Reasoning, not findings — so no evidence table, and never mixed in with the
  // observations themselves.
  function analysisBlock(a) {
    return '<div class="analysis-item"><h3>' + esc(a.title) + '</h3><ol>' +
      asArray(a.points).map(p => '<li>' + esc(p) + '</li>').join("") + '</ol>' +
      (a.consequence ? '<p class="consequence">' + esc(a.consequence) + '</p>' : '') +
      '</div>';
  }

  function render(doc) {
    if (!doc) {
      fail("The strategy record is empty. Seed it with update_strategy in a Strategy chat.");
      return;
    }
    const observations = asArray(doc.observations);
    // Live first, retired kept below — the record never deletes an observation
    // that stopped being true, it just stops leading with it.
    const live = observations.filter(o => o.state !== "retired");
    const retired = observations.filter(o => o.state === "retired");
    const analysis = asArray(doc.analysis);
    const scratch = asArray(doc.scratch);
    const questions = asArray(doc.questions);

    // The header is written here rather than in the markup so that the page has
    // no title, no description and no shape until the read has actually come back.
    $("head").innerHTML =
      '<h1>Strategic observations</h1>' +
      '<div class="stamp">Last written ' + esc(fmtStamp(doc.meta && doc.meta.lastUpdated)) +
      ' · ' + live.length + ' live observation' + (live.length === 1 ? "" : "s") + '</div>' +
      '<p class="standing">A record of durable structural observations about how the' +
      ' organisation actually works, with dated evidence accumulating underneath each' +
      ' one. It is a documentation of problems, not a list of fixes. Written in' +
      ' conversation; this page only reads.</p>';

    $("tier1").innerHTML =
      '<h2><span class="tier">Tier 1</span>Observations</h2>' +
      '<p class="tier-note">Settled. Each one is kept general — it should still be true' +
      ' after the incident that prompted it has faded. Specifics belong in the evidence' +
      ' table underneath.</p>' +
      (live.length ? live.map(observationBlock).join("")
                   : '<p class="empty">Nothing settled yet.</p>') +
      (retired.length ? '<h2><span class="tier">Tier 1</span>Retired</h2>' +
        retired.map(observationBlock).join("") : "");

    // Sits between the settled observations and the uncommitted pad, because it
    // is settled thinking — but it is reasoning, so it stays out of Tier 1.
    $("analysis").innerHTML = !analysis.length ? "" :
      '<h2>Analysis</h2>' +
      '<p class="tier-note">Why the pattern persists. Working explanations rather than' +
      ' findings — nothing here carries evidence, and nothing here is a claim about a' +
      ' particular event.</p>' +
      analysis.map(analysisBlock).join("");

    $("tier2").innerHTML =
      '<h2><span class="tier">Tier 2</span>Scratch pad</h2>' +
      '<p class="tier-note">Uncommitted. Anything thrown here mid-conversation, waiting to be' +
      ' folded up into an observation or dropped. Nothing on this list counts as part of the' +
      ' record yet.</p>' +
      (scratch.length
        ? '<ul class="scratch">' + scratch.map(s =>
            '<li><span class="ts">' + esc(fmtDay(s.ts)) + '</span><span>' + esc(s.text) +
            (s.anchor ? ' <span class="anchor">#' + esc(s.anchor) + '</span>' : '') +
            '</span></li>').join("") + '</ul>'
        : '<p class="empty">Pad is clear.</p>');

    $("tier3").innerHTML = !questions.length ? "" :
      '<h2>Open questions</h2><div class="questions">' +
      questions.map(q => '<p class="' + (q.state === "answered" ? "answered" : "") + '">' +
        esc(q.text) +
        (q.answer ? '<span class="answer"><br>' + esc(q.answer) + '</span>' : '') +
        '</p>').join("") + '</div>';

    $("foot").textContent = scratch.length
      ? scratch.length + " item" + (scratch.length === 1 ? "" : "s") + " on the pad, not yet ingested."
      : "Pad clear. Everything captured has been folded in or dropped.";

    show("doc");
  }
</script>
</body>
</html>
