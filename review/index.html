<!DOCTYPE html>
<!--
  REVIEW STORE — THE WINDOW
  v2.0 — 13/08/2026

  Changelog:
  v2.1 — Markdown tables. The renderer treated a pipe table as a paragraph
         and printed the bars. A block whose lines all start with | now
         renders as a table — header row honoured when a |---| separator
         follows it, cells carry inline styling and {{ref}}/{{fact}}
         resolution, and the table scrolls inside its own container on a
         narrow screen rather than widening the page. The markdown EXPORT
         needed no change: tables pass through it verbatim, already valid.
  v2.0 — Pages, and dewaffle. Two steers from the owner, applied together:
         - PAGINATED, NOT ACCORDION. The fold model made every section a row
           that opened in place; fine as a list, wrong as a reading
           experience. Now the contents page is home — title, thesis, one row
           per section — and each section is its own PAGE: part label, the
           section, previous/next at the foot, contents a tap away. Threads,
           facts and the spine detail are pages of their own. Routing is the
           URL hash, so cross-references navigate, back buttons work, and a
           live database write re-renders whatever page is open without
           moving you off it. Arrow keys page through on a keyboard.
         - DEWAFFLE. v1 narrated itself: every section of the page carried a
           sentence explaining the machinery ("Resolution is a status, never
           a deletion", "resolved into the prose at render", a footer lecture
           on computed numbering). All of it is gone. The page now shows the
           document's own text and its data — labels and counts, nothing
           auto-descriptive. The system is explained once, in the spec, not
           on every visit.
  v1.1 — Reader mode: sections rendered collapsed, details/summary folds.
  v1.0 — First build, against review/SPEC.md.

  This page renders the store readable; it never writes. Everything in it is
  authored by Claude through the MCP server (get_review / patch_review /
  export_review against /reviewStore). Numbers are never stored — computed
  from position here exactly as the server computes them (rvNumbering in
  walk-mcp/server.js; change one, change both).

  It deliberately does not look like the strategy dossier or the desk: cool
  typescript paper, the prose in a serif, the working machinery (statuses,
  part labels, datelines) in a small sans. One colour — a muted red — reserved
  for authoring faults: a {{ref:...}} with no target, a {{fact:...}} nothing
  defines. Private material is marked plainly and carries no number. Light
  only: paper has no dark mode.

  Access: the node is readable only by the owner's uid (database.rules.json)
  and writable by nobody. This HTML is public — GitHub Pages serves the repo —
  but pre-auth the page is blank: no heading, no labels, no placeholders.
  Document content is never committed to the repo.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<!-- Subresource requests (fonts, the Firebase SDK) must not carry this page's
     URL out in a Referer header. -->
<meta name="referrer" content="no-referrer">
<!-- Says nothing on purpose: the tab title is the one thing a passer-by reads. -->
<title>Private</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<style>
  /* Two voices, split by job: Literata carries everything that IS the
     document; the system sans carries the machinery AROUND it. */
  :root{
    --paper:#FBFBF8;
    --ink:#1D1C19;
    --faint:#6E6C66;
    --hairline:#E3E2DB;
    --rule:#C6C4BB;
    --fault:#9C3B2E;     /* the only colour: broken references and unknown facts */
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);
    font-family:'Literata',Georgia,serif;
    font-size:1.03rem;line-height:1.62;min-height:100vh;padding:0 22px 90px;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto}
  .hidden{display:none}
  a{color:inherit}

  .m{font-family:var(--sans);font-size:0.72rem;letter-spacing:0.1em;
    text-transform:uppercase;color:var(--faint)}

  /* ---- contents (home) ---- */
  header{padding:52px 0 20px;border-bottom:2px solid var(--ink)}
  h1{font-weight:700;font-size:1.55rem;line-height:1.2}
  .stamp{font-family:var(--sans);font-size:0.78rem;color:var(--faint);margin-top:10px}
  .thesis{margin:26px 0 6px;font-size:1.1rem;font-style:italic;max-width:56ch}

  .group{margin-top:34px}
  .group .m{display:block;padding-bottom:7px;border-bottom:1px solid var(--rule)}
  .rows a{display:flex;gap:14px;align-items:baseline;padding:12px 0;
    border-bottom:1px solid var(--hairline);text-decoration:none}
  .rows a:active{background:#F2F2ED}
  .rows .num{font-family:var(--sans);font-size:0.78rem;color:var(--faint);
    width:2.1em;flex-shrink:0;text-align:right}
  .rows .t{flex:1}
  .rows .aside{margin-left:auto;white-space:nowrap}
  .rows .private-row .t{color:var(--faint);font-style:italic}

  /* Statuses on an ink scale — how much of the section exists is a question
     of ink on the page. */
  .st{font-family:var(--sans);font-size:0.68rem;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--faint)}
  .st.empty::before{content:'○ '}
  .st.outlined::before{content:'◔ '}
  .st.drafted::before{content:'◕ '}
  .st.refined{color:var(--ink)}
  .st.refined::before{content:'● '}

  .private-tag{font-family:var(--sans);font-size:0.68rem;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--faint);
    border:1px dashed var(--rule);padding:2px 7px}

  /* ---- a section page ---- */
  .crumb{display:flex;justify-content:space-between;gap:16px;
    padding:26px 0 14px;border-bottom:1px solid var(--rule)}
  .crumb a{text-decoration:none}
  .page h1{font-size:1.4rem;margin-top:26px}
  .page h1 .num{color:var(--faint);font-weight:400}
  .page-meta{margin-top:8px;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
  .private-block{border-left:1px dashed var(--rule);padding-left:18px;margin-top:22px}

  .body{margin-top:6px}
  .body p,.body ul,.body ol,.body blockquote{margin-top:14px;max-width:58ch}
  .body ul,.body ol{padding-left:1.5em}
  .body li{margin-bottom:6px}
  .body blockquote{padding-left:16px;border-left:2px solid var(--rule);font-style:italic}
  .body code{font-family:ui-monospace,Menlo,monospace;font-size:0.88em;
    background:var(--hairline);padding:1px 4px}
  /* A wide table scrolls inside its own box; the page never scrolls sideways. */
  .tablewrap{margin-top:14px;max-width:100%;overflow-x:auto}
  .mdt{border-collapse:collapse;font-size:0.92rem;min-width:100%}
  .mdt th{text-align:left;font-family:var(--sans);font-size:0.68rem;font-weight:600;
    letter-spacing:0.12em;text-transform:uppercase;color:var(--faint);
    padding:0 18px 7px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
  .mdt td{padding:9px 18px 9px 0;border-bottom:1px solid var(--hairline);
    vertical-align:top}
  .mdt tr:last-child td{border-bottom:none}
  .mdt th:last-child,.mdt td:last-child{padding-right:0}
  .sub{margin-top:34px}
  .sub h2{font-weight:600;font-size:1.08rem}
  .sub h2 .num{color:var(--faint);font-weight:400}

  .notes{margin-top:26px;padding:10px 14px;background:#F2F2ED;
    font-family:var(--sans);font-size:0.85rem;line-height:1.55;color:#55534D;max-width:58ch}
  .notes .m{display:block;margin-bottom:4px}
  .refby{margin-top:18px;font-family:var(--sans);font-size:0.78rem;color:var(--faint)}
  .refby a{text-decoration:none;border-bottom:1px dotted var(--rule)}

  .xref{text-decoration:none;border-bottom:1px dotted var(--rule);white-space:nowrap}
  .fact{border-bottom:1px dotted var(--rule);cursor:help}
  .fault{color:var(--fault);font-family:var(--sans);font-size:0.85em}
  .quiet{font-size:0.92rem;color:var(--faint);font-style:italic;padding:14px 0}

  .pagenav{display:flex;justify-content:space-between;gap:18px;
    margin-top:56px;padding-top:16px;border-top:1px solid var(--rule)}
  .pagenav a{text-decoration:none;max-width:46%;font-size:0.95rem;line-height:1.4}
  .pagenav a.next{margin-left:auto;text-align:right}
  .pagenav .dir{display:block;font-family:var(--sans);font-size:0.66rem;
    letter-spacing:0.12em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}

  /* ---- threads / facts / spine pages ---- */
  .thread{padding:16px 0;border-bottom:1px solid var(--hairline)}
  .thread:last-child{border-bottom:none}
  .thread .tline{margin-bottom:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
  .thread .text{max-width:58ch}
  .thread .framing{margin-top:6px;font-style:italic;color:var(--faint);
    font-size:0.92rem;max-width:56ch}
  .thread.closed .text{text-decoration:line-through;
    text-decoration-color:var(--rule);color:var(--faint)}
  .thread .resolution{margin-top:6px;font-size:0.92rem;max-width:56ch}
  .thread .resolution .m{margin-right:8px}

  .facts{width:100%;border-collapse:collapse;margin-top:10px;font-size:0.94rem}
  .facts td{padding:10px 18px 10px 0;border-bottom:1px solid var(--hairline);vertical-align:baseline}
  .facts tr:last-child td{border-bottom:none}
  .facts .slug{font-family:ui-monospace,Menlo,monospace;font-size:0.78rem;color:var(--faint)}
  .facts .val{font-weight:600;white-space:nowrap}

  .principles{margin:14px 0 0;padding-left:1.5em}
  .principles li{margin-bottom:10px;max-width:56ch;padding-left:0.3em}
  .principles li::marker{color:var(--faint);font-size:0.85em}
  .decisions{margin-top:10px}
  .decisions li{list-style:none;padding:10px 0;border-bottom:1px solid var(--hairline);
    display:flex;gap:16px;align-items:baseline}
  .decisions li:last-child{border-bottom:none}
  .decisions .ts{font-family:var(--sans);font-size:0.76rem;color:var(--faint);
    white-space:nowrap;width:5.2em;flex-shrink:0}
  .decisions .why{color:var(--faint);font-style:italic}
  .page h3{font-weight:600;font-size:1rem;letter-spacing:0.1em;text-transform:uppercase;
    margin-top:40px;padding-bottom:7px;border-bottom:1px solid var(--rule)}

  .panel{max-width:400px;margin:22vh auto;text-align:center}
  .panel p{color:var(--faint);margin-bottom:22px;font-style:italic}
  button{font-family:var(--sans);font-size:0.78rem;font-weight:600;letter-spacing:0.13em;
    text-transform:uppercase;padding:11px 26px;background:transparent;color:var(--ink);
    border:1px solid var(--ink);cursor:pointer}
  button:hover{background:var(--ink);color:var(--paper)}

  @media (max-width:520px){
    body{font-size:0.99rem;padding:0 18px 70px}
    header{padding-top:34px}
    .rows .aside{display:none}
    .decisions li{flex-direction:column;gap:2px}
    .decisions .ts{width:auto}
  }
</style>
</head>
<body>

<!-- Nothing below says what this page is until the read succeeds: the gate is
     a bare control, the loading state is blank, and every view is injected
     after a successful read. (This empties the DOM, not the source — content
     is never in either.) -->

<div id="gate" class="panel hidden">
  <button id="signin">Sign in</button>
</div>

<div id="loading" class="panel"></div>

<div id="error" class="panel hidden"><p id="errmsg"></p></div>

<div id="doc" class="wrap hidden"><div id="view"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyA3ga4wTbLELE3jvrl40j7OclsYCt8PtIo",
    authDomain: "morning-walks-42eb6.firebaseapp.com",
    databaseURL: "https://morning-walks-42eb6-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "morning-walks-42eb6"
  });

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const show = id => { ["gate","loading","error","doc"].forEach(x => $(x).classList.add("hidden"));
    $(id).classList.remove("hidden"); };
  // RTDB collapses sparse arrays into objects, so never assume Array here.
  const asArray = v => Array.isArray(v) ? v : Object.values(v || {});
  const fail = msg => { $("errmsg").textContent = msg; show("error"); };

  $("signin").addEventListener("click", () =>
    firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e => fail("Sign-in failed: " + e.message)));

  let DOC = null;

  firebase.auth().onAuthStateChanged(user => {
    if (!user) { show("gate"); return; }
    show("loading");
    firebase.database().ref("reviewStore").on("value",
      snap => { DOC = snap.val(); route(false); },
      err => fail(err.code === "PERMISSION_DENIED"
        ? "This account doesn't have access."
        : "Couldn't load: " + err.message));
  });

  const fmtStamp = iso => {
    const d = new Date(iso);
    return isNaN(d) ? String(iso || "") : d.toLocaleString("en-GB",
      { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
  };
  const fmtDay = iso => {
    const d = new Date(iso);
    return isNaN(d) ? String(iso || "") : d.toLocaleDateString("en-GB",
      { day:"2-digit", month:"2-digit", year:"2-digit" });
  };

  const byPos = list => asArray(list).slice()
    .sort((a, b) => (Number(a?.position) || 0) - (Number(b?.position) || 0));

  /* Numbers are never stored — computed from position, identically to the
     server (rvNumbering in walk-mcp/server.js; change one, change both).
     Private material is skipped, not numbered-then-hidden, so the page and
     an export always agree. */
  function numberingOf(doc) {
    const map = {};
    let n = 0;
    byPos(doc.parts).forEach((part, pi) => {
      map[part.id] = String(pi + 1);
      byPos(asArray(doc.sections).filter(s => String(s?.partId) === String(part.id)))
        .forEach(s => {
          if (s.visibility === "private") return;
          map[s.id] = String(++n);
          let m = 0;
          byPos(asArray(s.subsections)).forEach(sub => {
            if (sub.visibility === "private") return;
            map[sub.id] = n + "." + (++m);
          });
        });
    });
    return map;
  }

  /* ---------- indexes, rebuilt on every render ---------- */
  let secById = {}, subOwner = {}, factById = {}, numbering = {}, order = [], partById = {};

  function reindex(doc) {
    secById = {}; subOwner = {}; factById = {}; partById = {}; order = [];
    asArray(doc.parts).forEach(p => { partById[p.id] = p; });
    byPos(doc.parts).forEach(part =>
      byPos(asArray(doc.sections).filter(s => String(s?.partId) === String(part.id)))
        .forEach(s => order.push(s.id)));
    asArray(doc.sections).forEach(s => { secById[s.id] = s;
      asArray(s.subsections).forEach(sub => { subOwner[sub.id] = s; }); });
    asArray(doc.facts).forEach(f => { factById[f.id] = f; });
    numbering = numberingOf(doc);
  }

  // Which sections point at a given id — derived on render, never stored.
  function referencedByIndex(doc) {
    const idx = {};
    const scan = (text, fromId) => {
      String(text || "").replace(/\{\{ref:([A-Za-z0-9_-]+)\}\}/g, (m, target) => {
        (idx[target] = idx[target] || []).includes(fromId) || idx[target].push(fromId);
        return m;
      });
    };
    asArray(doc.sections).forEach(s => {
      scan(s.body, s.id); scan(s.notes, s.id);
      asArray(s.subsections).forEach(sub => scan(sub.body, s.id));
    });
    return idx;
  }

  /* ---------- markdown + marker resolution ----------
     Bodies are markdown prose — no headings; structure lives in subsections
     and heading depth is this page's concern (spec §3.2). Escape first;
     {{ref:...}} and {{fact:...}} markers survive escaping untouched, so they
     resolve after, injecting known-safe markup. */

  const resolveMarkers = html => html
    .replace(/\{\{ref:([A-Za-z0-9_-]+)\}\}/g, (_, id) => {
      const target = secById[id] || (subOwner[id] &&
        asArray(subOwner[id].subsections).find(x => String(x.id) === String(id)));
      if (!target) return '<span class="fault" title="no section or subsection has this id">[unresolved reference: ' + esc(id) + ']</span>';
      const n = numbering[id];
      if (n === undefined) return '<span class="fault" title="the target is private and carries no number">[reference to private material]</span>';
      return '<a class="xref" href="#x-' + esc(id) + '" title="' + esc(target.title) + '">§' + n + '</a>';
    })
    .replace(/\{\{fact:([A-Za-z0-9_-]+)\}\}/g, (_, id) => {
      const f = factById[id];
      if (!f) return '<span class="fault" title="no fact has this id">[unknown fact: ' + esc(id) + ']</span>';
      return '<span class="fact" title="' + esc(f.label || f.id) + '">' + esc(f.value) + '</span>';
    });

  const inline = s => resolveMarkers(esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g, "<em>$1</em>"));

  function md(text) {
    return String(text || "").split(/\n\s*\n/).map(b => b.trim()).filter(Boolean)
      .map(b => {
        const lines = b.split("\n");
        if (lines.length > 1 && lines.every(l => l.trim().startsWith("|"))) {
          const rows = lines.map(l => l.trim().replace(/^\|/, "").replace(/\|$/, "")
            .split("|").map(c => c.trim()));
          const isSep = r => r.length > 0 && r.every(c => /^:?-+:?$/.test(c));
          const header = rows.length > 1 && isSep(rows[1]) ? rows[0] : null;
          const body = (header ? rows.slice(2) : rows).filter(r => !isSep(r));
          return '<div class="tablewrap"><table class="mdt">' +
            (header ? '<thead><tr>' + header.map(c => '<th>' + inline(c) + '</th>').join("") +
              '</tr></thead>' : "") +
            '<tbody>' + body.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join("") +
              '</tr>').join("") + '</tbody></table></div>';
        }
        if (lines.every(l => /^[-*] /.test(l)))
          return "<ul>" + lines.map(l => "<li>" + inline(l.slice(2)) + "</li>").join("") + "</ul>";
        if (lines.every(l => /^\d+[.)] /.test(l)))
          return "<ol>" + lines.map(l => "<li>" + inline(l.replace(/^\d+[.)] /, "")) + "</li>").join("") + "</ol>";
        if (lines.every(l => /^>/.test(l)))
          return "<blockquote><p>" + inline(lines.map(l => l.replace(/^> ?/, "")).join("\n")).replace(/\n/g, "<br>") + "</p></blockquote>";
        return "<p>" + inline(b).replace(/\n/g, "<br>") + "</p>";
      }).join("");
  }

  const statusChip = s =>
    '<span class="st ' + esc(s.status || "empty") + '">' + esc(s.status || "empty") + '</span>';
  const privateTag = '<span class="private-tag">Private</span>';
  const crumb = right =>
    '<div class="crumb"><a class="m" href="#">Contents</a>' +
    (right ? '<span class="m">' + right + '</span>' : "") + '</div>';

  /* ---------- routing ----------
     The hash is the page: '' contents, 'x-<id>' a section (or the section
     owning a subsection), 'threads', 'facts', 'spine'. A live write
     re-renders the open page in place; only navigation scrolls to top. */

  window.addEventListener("hashchange", () => route(true));

  function route(fromNav) {
    if (!DOC) { fail("Nothing here yet."); return; }
    reindex(DOC);
    const h = decodeURIComponent(location.hash.slice(1));
    if (h.startsWith("x-")) {
      const id = h.slice(2);
      const sec = secById[id] || subOwner[id];
      if (sec) renderSection(sec); else renderContents();
    }
    else if (h === "threads") renderThreads();
    else if (h === "facts") renderFacts();
    else if (h === "spine") renderSpine();
    else renderContents();
    if (fromNav) window.scrollTo(0, 0);
    show("doc");
  }

  document.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h.startsWith("x-")) return;
    const sec = secById[h.slice(2)] || subOwner[h.slice(2)];
    if (!sec) return;
    const i = order.indexOf(sec.id) + (e.key === "ArrowRight" ? 1 : -1);
    if (i >= 0 && i < order.length) location.hash = "#x-" + order[i];
  });

  /* ---------- pages ---------- */

  function renderContents() {
    const doc = DOC;
    const sections = asArray(doc.sections);
    const threads = asArray(doc.threads);
    const facts = asArray(doc.facts);
    const spine = doc.spine || {};
    const open = threads.filter(t => !t.status || t.status === "open");
    const principles = asArray(spine.principles);
    const decisions = asArray(spine.decisions);

    const auxRow = (hash, label, aside) =>
      '<a href="#' + hash + '"><span class="num"></span><span class="t">' + label +
      '</span><span class="aside m">' + aside + '</span></a>';

    $("view").innerHTML =
      '<header><h1>' + esc(spine.title || "Working draft") + '</h1>' +
      '<div class="stamp">Last written ' + esc(fmtStamp(doc.meta && doc.meta.lastUpdated)) +
      ' &nbsp;·&nbsp; ' + sections.length + ' section' + (sections.length === 1 ? "" : "s") +
      ' &nbsp;·&nbsp; ' + open.length + ' open thread' + (open.length === 1 ? "" : "s") +
      '</div></header>' +
      (spine.thesis ? '<p class="thesis">' + esc(spine.thesis) + '</p>' : "") +
      byPos(doc.parts).map(part => {
        const inPart = byPos(sections.filter(s => String(s.partId) === String(part.id)));
        return '<div class="group"><span class="m">Part ' + esc(numbering[part.id]) +
          ' — ' + esc(part.title) + '</span><div class="rows">' +
          (inPart.length ? inPart.map(s => {
            const priv = s.visibility === "private";
            return '<a href="#x-' + esc(s.id) + '"' + (priv ? ' class="private-row"' : "") + '>' +
              '<span class="num">' + (priv ? "—" : esc(numbering[s.id])) + '</span>' +
              '<span class="t">' + esc(s.title) + '</span>' +
              '<span class="aside">' + statusChip(s) + '</span></a>';
          }).join("") : '<p class="quiet">Empty.</p>') +
          '</div></div>';
      }).join("") +
      '<div class="group"><span class="m">Working state</span><div class="rows">' +
      ((principles.length || decisions.length) ? auxRow("spine", "Spine",
        principles.length + " principle" + (principles.length === 1 ? "" : "s") +
        (decisions.length ? " · " + decisions.length + " decision" + (decisions.length === 1 ? "" : "s") : "")) : "") +
      (threads.length ? auxRow("threads", "Threads", open.length + " open") : "") +
      (facts.length ? auxRow("facts", "Facts", String(facts.length)) : "") +
      '</div></div>';
  }

  function subBlock(sub) {
    const priv = sub.visibility === "private";
    return '<div class="sub' + (priv ? ' private-block' : '') + '" id="x-' + esc(sub.id) + '">' +
      '<h2>' + (priv ? "" : '<span class="num">' + esc(numbering[sub.id] || "") + '&ensp;</span>') +
      esc(sub.title) + (priv ? " &ensp;" + privateTag : "") + '</h2>' +
      '<div class="body">' + md(sub.body) + '</div></div>';
  }

  function renderSection(s) {
    const priv = s.visibility === "private";
    const refby = referencedByIndex(DOC);
    const sources = (refby[s.id] || []).map(id => ({ id, n: numbering[id] }))
      .filter(x => x.n !== undefined).sort((a, b) => Number(a.n) - Number(b.n));
    const i = order.indexOf(s.id);
    const navLink = (id, cls, dir) => {
      const t = secById[id];
      const n = numbering[id];
      return '<a class="' + cls + '" href="#x-' + esc(id) + '"><span class="dir">' + dir +
        '</span>' + (n !== undefined ? "§" + n + " " : "") + esc(t.title) + '</a>';
    };
    $("view").innerHTML =
      '<div class="page">' +
      crumb("Part " + esc(numbering[s.partId] || "") + " — " + esc((partById[s.partId] || {}).title || "")) +
      '<h1>' + (priv ? "" : '<span class="num">' + esc(numbering[s.id] || "") + '.&ensp;</span>') +
      esc(s.title) + '</h1>' +
      '<div class="page-meta">' + statusChip(s) +
        (s.lengthTarget ? '<span class="m">' + esc(s.lengthTarget) + '</span>' : "") +
        (priv ? privateTag : "") + '</div>' +
      '<div' + (priv ? ' class="private-block"' : '') + '>' +
      (String(s.body || "").trim() ? '<div class="body">' + md(s.body) + '</div>'
        : '<p class="quiet">Not drafted.</p>') +
      byPos(asArray(s.subsections)).map(subBlock).join("") +
      '</div>' +
      (s.notes ? '<div class="notes"><span class="m">Notes</span>' + esc(s.notes) + '</div>' : "") +
      (sources.length ? '<p class="refby">Referenced from ' +
        sources.map(x => '<a href="#x-' + esc(x.id) + '">§' + esc(x.n) + '</a>').join(", ") + '</p>' : "") +
      '<div class="pagenav">' +
      (i > 0 ? navLink(order[i - 1], "prev", "Previous") : "") +
      (i >= 0 && i < order.length - 1 ? navLink(order[i + 1], "next", "Next") : "") +
      '</div></div>';
  }

  function threadBlock(t) {
    const closed = t.status && t.status !== "open";
    const targets = asArray(t.targets).map(id => {
      const n = numbering[id];
      return n === undefined ? null :
        '<a class="xref" href="#x-' + esc(id) + '" title="' + esc((secById[id] || {}).title || "") + '">§' + n + '</a>';
    }).filter(Boolean);
    return '<div class="thread' + (closed ? " closed" : "") + '">' +
      '<div class="tline">' +
        (targets.length ? targets.join(" ") : '<span class="m">Document-wide</span>') +
        (t.visibility === "private" ? " " + privateTag : "") + '</div>' +
      '<p class="text">' + esc(t.text) + '</p>' +
      (t.framing ? '<p class="framing">' + esc(t.framing) + '</p>' : "") +
      (closed ? '<p class="resolution"><span class="m">' + esc(t.status) +
        (t.resolvedTs ? " · " + esc(fmtDay(t.resolvedTs)) : "") + '</span>' +
        esc(t.resolution || "") + '</p>' : "") +
      '</div>';
  }

  function renderThreads() {
    const threads = asArray(DOC.threads);
    const open = threads.filter(t => !t.status || t.status === "open");
    const closed = threads.filter(t => t.status && t.status !== "open");
    $("view").innerHTML = '<div class="page">' + crumb("") +
      '<h1>Threads</h1>' +
      (open.length ? open.map(threadBlock).join("") : '<p class="quiet">Nothing open.</p>') +
      (closed.length ? '<h3>Closed</h3>' + closed.map(threadBlock).join("") : "") +
      '</div>';
  }

  function renderFacts() {
    const facts = asArray(DOC.facts);
    $("view").innerHTML = '<div class="page">' + crumb("") +
      '<h1>Facts</h1>' +
      '<table class="facts">' + facts.map(f =>
        '<tr><td class="val">' + esc(f.value) + '</td><td>' + esc(f.label || "") +
        '</td><td class="slug">{{fact:' + esc(f.id) + '}}</td></tr>').join("") + '</table>' +
      '</div>';
  }

  function renderSpine() {
    const spine = DOC.spine || {};
    const principles = asArray(spine.principles);
    const decisions = asArray(spine.decisions);
    $("view").innerHTML = '<div class="page">' + crumb("") +
      '<h1>Spine</h1>' +
      (spine.thesis ? '<p class="thesis">' + esc(spine.thesis) + '</p>' : "") +
      (principles.length ? '<h3>Principles</h3><ol class="principles">' +
        principles.map(p => '<li>' + esc(p) + '</li>').join("") + '</ol>' : "") +
      (decisions.length ? '<h3>Decisions</h3><ul class="decisions">' +
        decisions.map(d => '<li><span class="ts">' + esc(fmtDay(d.ts)) + '</span><span>' +
          esc(d.what) + (d.why ? ' <span class="why">— ' + esc(d.why) + '</span>' : "") +
          '</span></li>').join("") + '</ul>' : "") +
      '</div>';
  }
</script>
</body>
</html>
